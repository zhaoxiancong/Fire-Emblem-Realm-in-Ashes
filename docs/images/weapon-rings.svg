<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>《山河烬》武器双环（兵刃三环 + 三才法环）与环外中立位</title>
  <desc>三栏分组图：左栏兵刃三环为枪（ITYPE_LANCE）克刀剑（ITYPE_SWORD）克锤（ITYPE_AXE）克枪；中栏三才法环为天（ITYPE_ANIMA）克地（ITYPE_DARK）克人（ITYPE_LIGHT）克天；右栏为环外中立位，含弓弩（ITYPE_BOW）、医药（ITYPE_STAFF）、兽灵与神器，与环内类型互不克制。底部注明本项目不新增武器类型，因 ranks[8]、baseRanks[8] 为 8 格硬上限。</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#ffffff"/>

  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">武器双环与环外中立位：原创武器系 → 原版 ITYPE 映射</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">「刀剑一家」—— 剑与刀同归 ITYPE_SWORD 同入环；「中立」这一生态位由弓 / 弩（ITYPE_BOW）天然承担，原版即如此</text>

  <!-- ================= 面板 A：兵刃三环 ================= -->
  <rect x="20" y="64" width="200" height="292" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="32" y="86" font-size="13" font-weight="700" fill="#b45309">① 兵刃三环（物理）</text>
  <text x="32" y="103" font-size="10" fill="#8a5a00">枪 → 刀剑 → 锤 → 枪</text>

  <!-- 环：拓扑示意 -->
  <circle cx="120" cy="168" r="38" fill="none" stroke="#e3c9a8" stroke-width="1"/>
  <line x1="128" y1="143.9" x2="144.9" y2="173.1" stroke="#8a94a0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="136.9" y1="187" x2="103.1" y2="187" stroke="#8a94a0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="95.1" y1="173.1" x2="112" y2="143.9" stroke="#8a94a0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="120" cy="130" r="16" fill="#b45309"/>
  <text x="120" y="135" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">枪</text>
  <circle cx="152.9" cy="187" r="16" fill="#c2703a"/>
  <text x="152.9" y="192" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">刀</text>
  <circle cx="87.1" cy="187" r="16" fill="#8a5a00"/>
  <text x="87.1" y="192" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">锤</text>

  <!-- 卡片 -->
  <g>
    <rect x="30" y="216" width="180" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="40" y="234" font-size="12.5" font-weight="600" fill="#1f2328">枪<tspan font-size="10" font-weight="400" fill="#57606a">（长枪手系）</tspan></text>
    <text x="40" y="250" font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#57606a">ITYPE_LANCE · 克刀剑</text>

    <rect x="30" y="262" width="180" height="42" rx="6" fill="#ffffff" stroke="#c2703a" stroke-width="1.4"/>
    <text x="40" y="280" font-size="12.5" font-weight="600" fill="#1f2328">刀剑<tspan font-size="10" font-weight="400" fill="#57606a">（佩剑郎 / 游刀手系）</tspan></text>
    <text x="40" y="296" font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#b45309">ITYPE_SWORD · 克锤</text>

    <rect x="30" y="308" width="180" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="40" y="326" font-size="12.5" font-weight="600" fill="#1f2328">锤<tspan font-size="10" font-weight="400" fill="#57606a">（力士系）</tspan></text>
    <text x="40" y="342" font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#57606a">ITYPE_AXE · 克枪</text>
  </g>

  <!-- ================= 面板 B：三才法环 ================= -->
  <rect x="240" y="64" width="200" height="292" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="252" y="86" font-size="13" font-weight="700" fill="#1d4ed8">② 三才法环（法术）</text>
  <text x="252" y="103" font-size="10" fill="#3b5bdb">天 → 地 → 人 → 天</text>

  <circle cx="340" cy="168" r="38" fill="none" stroke="#c3d0ee" stroke-width="1"/>
  <line x1="348" y1="143.9" x2="364.9" y2="173.1" stroke="#8a94a0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="356.9" y1="187" x2="323.1" y2="187" stroke="#8a94a0" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="315.1" y1="173.1" x2="332" y2="143.9" stroke="#8a94a0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="340" cy="130" r="16" fill="#1d4ed8"/>
  <text x="340" y="135" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">天</text>
  <circle cx="372.9" cy="187" r="16" fill="#4c6ef5"/>
  <text x="372.9" y="192" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">地</text>
  <circle cx="307.1" cy="187" r="16" fill="#3b5bdb"/>
  <text x="307.1" y="192" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">人</text>

  <g>
    <rect x="250" y="216" width="180" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="260" y="234" font-size="12.5" font-weight="600" fill="#1f2328">天<tspan font-size="10" font-weight="400" fill="#57606a">（雷法 / 符箓）</tspan></text>
    <text x="260" y="250" font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#57606a">ITYPE_ANIMA · 克地</text>

    <rect x="250" y="262" width="180" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="260" y="280" font-size="12.5" font-weight="600" fill="#1f2328">地<tspan font-size="10" font-weight="400" fill="#57606a">（巫蛊 / 咒具）</tspan></text>
    <text x="260" y="296" font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#57606a">ITYPE_DARK · 克人</text>

    <rect x="250" y="308" width="180" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="260" y="326" font-size="12.5" font-weight="600" fill="#1f2328">人<tspan font-size="10" font-weight="400" fill="#57606a">（礼乐 / 琴）</tspan></text>
    <text x="260" y="342" font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#57606a">ITYPE_LIGHT · 克天</text>
  </g>

  <!-- ================= 面板 C：环外中立 ================= -->
  <rect x="460" y="64" width="200" height="292" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="472" y="86" font-size="13" font-weight="700" fill="#57606a">③ 环外 · 中立位</text>
  <text x="472" y="103" font-size="10" fill="#6e7781">与环内类型互不克制</text>

  <!-- 无环符号 -->
  <circle cx="560" cy="168" r="30" fill="#ffffff" stroke="#b8c0c8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="538.8" y1="146.8" x2="581.2" y2="189.2" stroke="#b8c0c8" stroke-width="2"/>
  <text x="560" y="212" font-size="9.5" fill="#6e7781" text-anchor="middle">不参与任何环</text>

  <g>
    <rect x="470" y="216" width="180" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="480" y="234" font-size="12.5" font-weight="600" fill="#1f2328">弓 / 弩<tspan font-size="10" font-weight="400" fill="#57606a">（猎户 / 机关师系）</tspan></text>
    <text x="480" y="250" font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#57606a">ITYPE_BOW · 射程优势</text>

    <rect x="470" y="262" width="180" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="480" y="280" font-size="12.5" font-weight="600" fill="#1f2328">医药<tspan font-size="10" font-weight="400" fill="#57606a">（辅祭系）</tspan></text>
    <text x="480" y="296" font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#57606a">ITYPE_STAFF · 无环</text>

    <rect x="470" y="308" width="180" height="42" rx="6" fill="#fffdf7" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="480" y="326" font-size="12.5" font-weight="600" fill="#1f2328">兽灵 / ★神器<tspan font-size="9.5" font-weight="400" fill="#b45309"> 实现待定</tspan></text>
    <text x="480" y="342" font-size="9.5" fill="#8a5a00">兽灵走变身；神器「不入环」需属性位守卫</text>
  </g>

  <!-- ================= 底部注脚 ================= -->
  <rect x="20" y="366" width="640" height="64" rx="8" fill="#fff8f0" stroke="#e8d3b8"/>
  <text x="32" y="386" font-size="11" font-weight="600" fill="#8a5a00">为什么不新增「剑」类型？</text>
  <text x="32" y="404" font-size="10.5" fill="#57606a">原版 ITYPE_* 枚举实际有 13 个值（0–12），但只有 0–7 有熟练度格；ranks[8] / baseRanks[8] 是 8 格硬上限，且按 ITYPE 直接索引。</text>
  <text x="32" y="420" font-size="10.5" fill="#57606a">新增第 9 格必须改存档布局并提升 EXPANSION_SAVE_COMPAT_EPOCH（老档全废）⇒ 已否决。完整代价见《3.游戏数值设定.md》§2 决策记录。</text>
</svg>
