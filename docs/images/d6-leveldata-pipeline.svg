<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>关卡数据的产出链路：从剧情设计到 ROM</title>
  <desc>展示文档 1 的剧情与地图设计如何转为每章一个 bundle 的 JSON 数据，再经三动词管线生成 C89 并进入 ROM，同时标出人读部分与机读部分的分界。</desc>

  <rect width="680" height="480" fill="#F7F8FA" rx="8"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#1A1D24">关卡数据的产出链路</text>
  <text x="24" y="52" font-size="11.5" fill="#6B7280">D-6 核心：设计的部分留在文档，数据的部分交给管线 —— 不做第二份手抄</text>

  <!-- 人读区（左） -->
  <rect x="24" y="70" width="220" height="180" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="8"/>
  <text x="134" y="92" font-size="12.5" font-weight="700" fill="#1E40AF" text-anchor="middle">人读部分（设计）</text>
  <text x="134" y="110" font-size="10" fill="#3B82F6" text-anchor="middle">Markdown · git 追踪 · 可 diff</text>

  <rect x="38" y="122" width="192" height="30" fill="#FFFFFF" rx="4"/>
  <text x="134" y="141" font-size="10.5" fill="#1F2937" text-anchor="middle">1.剧情与世界观 §4.5</text>
  <text x="134" y="162" font-size="9.5" fill="#6B7280" text-anchor="middle">Demo 五章详细剧情</text>

  <rect x="38" y="166" width="192" height="30" fill="#FFFFFF" rx="4"/>
  <text x="134" y="185" font-size="10.5" fill="#1F2937" text-anchor="middle">1.剧情与世界观 §4.6</text>
  <text x="134" y="206" font-size="9.5" fill="#6B7280" text-anchor="middle">全二十章剧情 + 地图设计</text>

  <rect x="38" y="210" width="192" height="30" fill="#FFFFFF" rx="4"/>
  <text x="134" y="229" font-size="10.5" fill="#1F2937" text-anchor="middle">1.剧情与世界观 §4.7</text>
  <text x="134" y="250" font-size="9.5" fill="#6B7280" text-anchor="middle">地图通用规则 + 尺寸校验</text>

  <!-- 箭头 -->
  <path d="M 248 160 L 288 160" stroke="#9CA3AF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <text x="268" y="150" font-size="9.5" fill="#6B7280" text-anchor="middle">人工翻译</text>

  <!-- 机读区（中） -->
  <rect x="292" y="70" width="200" height="180" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5" rx="8"/>
  <text x="392" y="92" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">机读部分（数据）</text>
  <text x="392" y="110" font-size="10" fill="#10B981" text-anchor="middle">JSON · 可校验 · 可编译</text>

  <text x="392" y="132" font-size="10.5" fill="#1F2937" text-anchor="middle" font-weight="600">content/data/chN_*.json</text>

  <rect x="304" y="142" width="176" height="21" fill="#FFFFFF" rx="3"/>
  <text x="392" y="157" font-size="10" fill="#374151" text-anchor="middle">chN_units.json（单位出场）</text>
  <rect x="304" y="166" width="176" height="21" fill="#FFFFFF" rx="3"/>
  <text x="392" y="181" font-size="10" fill="#374151" text-anchor="middle">chN_shops.json（商店）</text>
  <rect x="304" y="190" width="176" height="21" fill="#FFFFFF" rx="3"/>
  <text x="392" y="205" font-size="10" fill="#374151" text-anchor="middle">chN_traps.json（陷阱/地形）</text>
  <rect x="304" y="214" width="176" height="21" fill="#FFFFFF" rx="3"/>
  <text x="392" y="229" font-size="10" fill="#374151" text-anchor="middle">chN_eventscripts.json（事件）</text>

  <!-- 箭头 -->
  <path d="M 496 160 L 536 160" stroke="#9CA3AF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="516" y="150" font-size="9.5" fill="#6B7280" text-anchor="middle">管线</text>

  <!-- 产线区（右） -->
  <rect x="540" y="70" width="116" height="180" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" rx="8"/>
  <text x="598" y="92" font-size="12" font-weight="700" fill="#78350F" text-anchor="middle">三动词</text>

  <rect x="550" y="102" width="96" height="26" fill="#FFFFFF" rx="4"/>
  <text x="598" y="119" font-size="10" fill="#374151" text-anchor="middle">validate</text>
  <rect x="550" y="134" width="96" height="26" fill="#FFFFFF" rx="4"/>
  <text x="598" y="151" font-size="10" fill="#374151" text-anchor="middle">generate</text>
  <rect x="550" y="166" width="96" height="26" fill="#FFFFFF" rx="4"/>
  <text x="598" y="183" font-size="10" fill="#374151" text-anchor="middle">check</text>

  <path d="M 598 194 L 598 214" stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="550" y="218" width="96" height="26" fill="#1F2937" rx="4"/>
  <text x="598" y="235" font-size="10" fill="#FBBF24" text-anchor="middle" font-weight="600">ROM</text>

  <!-- Bundle 说明 -->
  <rect x="24" y="264" width="632" height="100" fill="#FFFFFF" stroke="#D1D5DB" rx="6"/>
  <text x="38" y="285" font-size="12" font-weight="700" fill="#1F2937">★ 每章一个 Bundle：把 5 张叶子表绑成一个自洽整体</text>
  <text x="38" y="304" font-size="10.5" fill="#4B5563">chN_bundle.json 不是数据本身，是「本章由哪些表组成 + 依赖哪些角色/职业/道具」的声明书。</text>

  <rect x="38" y="314" width="600" height="40" fill="#F0FDF4" rx="4"/>
  <text x="48" y="330" font-size="10" fill="#065F46">校验能力（Markdown 关卡表永远做不到）：</text>
  <text x="48" y="346" font-size="9.5" fill="#047857">① 章节设置行真的指向本章  ② internalName/mapEventDataId 一致  ③ 每个符号都能从 manifest 到达  ④ 支援双方互惠  ⑤ 依赖的角色/职业/道具必须真实存在（防悬空引用）</text>

  <!-- 结论条 -->
  <rect x="24" y="376" width="632" height="88" fill="#1F2937" rx="6"/>
  <text x="40" y="400" font-size="12.5" font-weight="700" fill="#FBBF24">D-6 定案：不新建关卡表文档，直接数据化</text>
  <text x="40" y="422" font-size="10.5" fill="#E5E7EB">为什么：火纹社区传统"写 Markdown 关卡表"来自 FEBuilderGBA 时代（数据在 GUI 里，文档是唯一留痕）。</text>
  <text x="40" y="440" font-size="10.5" fill="#E5E7EB">本框架下数据本身就是 JSON —— 继续写 Markdown = 主动引入双处维护（文档说 8 个敌人，JSON 里有 9 个，谁对？）。</text>
  <text x="40" y="458" font-size="10.5" fill="#FBBF24">实测：框架自带 ch2_*.json 六件套就是现成范例，79 个章节槽位装 20 章绰绰有余 —— 照抄结构即可。</text>
</svg>
