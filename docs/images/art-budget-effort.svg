<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>《山河烬》美术工作量结构：谁是真大头</title>
  <desc>对比立绘、章节地图、战斗动画、瓦片集、图标、音乐、特效七类资产的单位成本与总量，指出真正的大头是"立绘（量）+ 地图瓦片集（一次性壁垒）"，而非章节地图布局本身。</desc>

  <rect width="680" height="430" fill="#F7F8FA" rx="8"/>

  <text x="24" y="32" font-size="17" font-weight="700" fill="#1A1D24">美术工作量结构：谁是真大头</text>
  <text x="24" y="52" font-size="11.5" fill="#6B7280">纵轴 = 单位成本（每套/每章）；柱内数字 = 项目总需求量</text>

  <!-- 坐标轴 -->
  <line x1="86" y1="72" x2="86" y2="372" stroke="#C7CBD1" stroke-width="1"/>
  <line x1="86" y1="372" x2="648" y2="372" stroke="#C7CBD1" stroke-width="1"/>

  <!-- 单位成本刻度参考线（非数字轴，定性四档） -->
  <line x1="86" y1="120" x2="648" y2="120" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="86" y1="196" x2="648" y2="196" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="86" y1="272" x2="648" y2="272" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="80" y="124" font-size="10" fill="#9CA3AF" text-anchor="end">极高</text>
  <text x="80" y="200" font-size="10" fill="#9CA3AF" text-anchor="end">高</text>
  <text x="80" y="276" font-size="10" fill="#9CA3AF" text-anchor="end">中</text>
  <text x="80" y="368" font-size="10" fill="#9CA3AF" text-anchor="end">低</text>

  <!-- 柱：每组 70 宽，7 组 -->
  <!-- x 起点 110，间距 78 -->
  <!-- 1. 立绘：单位成本 高(292) 总量 22 -->
  <rect x="110" y="180" width="58" height="192" fill="#D9534F" rx="3"/>
  <text x="139" y="206" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">22</text>
  <text x="139" y="226" font-size="10" fill="#FEE2E2" text-anchor="middle">套</text>

  <!-- 2. 章节地图布局：单位成本 中(242) 总量 20 -->
  <rect x="188" y="240" width="58" height="132" fill="#E8912F" rx="3"/>
  <text x="217" y="266" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">20</text>
  <text x="217" y="286" font-size="10" fill="#FEF3C7" text-anchor="middle">章</text>

  <!-- 3. 战斗动画：单位成本 极高(262) 总量 3 -->
  <rect x="266" y="110" width="58" height="262" fill="#8B5CF6" rx="3"/>
  <text x="295" y="136" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="295" y="156" font-size="10" fill="#EDE9FE" text-anchor="middle">条</text>

  <!-- 4. 地图瓦片集：单位成本 极高(200) 总量 1 -->
  <rect x="344" y="172" width="58" height="200" fill="#C026D3" rx="3"/>
  <text x="373" y="198" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="373" y="218" font-size="10" fill="#FAE8FF" text-anchor="middle">次</text>

  <!-- 5. 职业图标：低(72) 总量 15 -->
  <rect x="422" y="300" width="58" height="72" fill="#3B82F6" rx="3"/>
  <text x="451" y="326" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">15</text>
  <text x="451" y="346" font-size="10" fill="#DBEAFE" text-anchor="middle">链</text>

  <!-- 6. 音乐：低(60) 总量 8 -->
  <rect x="500" y="312" width="58" height="60" fill="#10B981" rx="3"/>
  <text x="529" y="338" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="529" y="358" font-size="10" fill="#D1FAE5" text-anchor="middle">首</text>

  <!-- 7. 神器特效：低(40) 总量 3 -->
  <rect x="578" y="332" width="58" height="40" fill="#F59E0B" rx="3"/>
  <text x="607" y="356" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- x 轴标签 -->
  <text x="139" y="390" font-size="11" fill="#374151" text-anchor="middle">角色立绘</text>
  <text x="217" y="390" font-size="11" fill="#374151" text-anchor="middle">地图布局</text>
  <text x="295" y="390" font-size="11" fill="#374151" text-anchor="middle">战斗动画</text>
  <text x="373" y="390" font-size="11" fill="#374151" text-anchor="middle">瓦片集</text>
  <text x="451" y="390" font-size="11" fill="#374151" text-anchor="middle">职业图标</text>
  <text x="529" y="390" font-size="11" fill="#374151" text-anchor="middle">BGM</text>
  <text x="607" y="390" font-size="11" fill="#374151" text-anchor="middle">特效</text>

  <!-- 关键洞察 -->
  <rect x="24" y="404" width="632" height="18" fill="#FEF3C7" rx="4"/>
  <text x="34" y="417" font-size="11" fill="#92400E">★ 立绘 = 唯一"数量 × 成本"双高的项（22 × 高）；瓦片集 = 唯一"低数量 × 极高成本"的一次性壁垒（1 × 极高）。章节地图布局反而不是大头。</text>
</svg>
