  <!-- 底部统计 -->
  <rect x="20" y="530" width="640" height="22" fill="#EEF2F6" rx="4"/>
  <text x="32" y="545" font-size="10.5" fill="#374151">21 张地图全部 ≤ 288 格（红线 1023 的 28%）；Demo 五章平均 196 格；仅 3 章需地图变更（⚠），须预留额外工时</text>
</svg>
