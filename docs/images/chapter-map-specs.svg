    <text x="76" y="141">14×14</text>
    <text x="140" y="141">196</text>
    <text x="230" y="141">山民寨（双寨门防守）</text>
    <text x="440" y="141">ObjectType8 村落</text>
    <text x="596" y="141" fill="#9CA3AF">—</text>

    <rect x="20" y="147" width="640" height="21" fill="#FFFFFF"/>
    <text x="30" y="162" font-weight="600">3</text>
    <text x="76" y="162">18×12</text>
    <text x="140" y="162">216</text>
    <text x="230" y="162">孟津渡（占旗）</text>
    <text x="440" y="162">ObjectType7 水岸</text>
    <text x="596" y="162" fill="#9CA3AF">—</text>

    <rect x="20" y="168" width="640" height="21" fill="#F0FDF4"/>
    <text x="30" y="183" font-weight="600">4</text>
    <text x="76" y="183">20×14</text>
    <text x="140" y="183">280</text>
    <text x="230" y="183">洛邑城区夜战</text>
