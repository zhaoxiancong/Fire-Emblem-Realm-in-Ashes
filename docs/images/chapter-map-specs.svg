    <rect x="20" y="273" width="640" height="21" fill="#FFFFFF"/>
    <text x="30" y="288" font-weight="600">9</text>
    <text x="76" y="288">18×14</text>
    <text x="140" y="288">252</text>
    <text x="230" y="288">灰潮草原</text>
