<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>二十一章地图规格一览（尺寸 / 格子数 / 瓦片集 / 地图变更）</title>
  <desc>逐章列出序章到第 20 章及两个外传的地图尺寸、格子数（对照 1023 上限）、主题与复用的原版瓦片集，并标出需要手写事件数据的地图变更章节。</desc>

  <rect width="680" height="560" fill="#F7F8FA" rx="8"/>
  <text x="24" y="30" font-size="16.5" font-weight="700" fill="#1A1D24">二十一章地图规格一览</text>
  <text x="24" y="49" font-size="11" fill="#6B7280">红线：宽 × 高 ≤ 1023 格（地图缓冲 2048 字节）｜⚠ 标记 = 需要手写事件数据的地图变更</text>

  <!-- 表头 -->
  <rect x="20" y="60" width="640" height="24" fill="#374151" rx="3"/>
  <g font-size="10.5" fill="#FFFFFF" font-weight="600">
    <text x="30" y="76">章</text>
    <text x="76" y="76">尺寸</text>
    <text x="140" y="76">格子数</text>
    <text x="230" y="76">主题</text>
    <text x="440" y="76">复用瓦片集</text>
    <text x="596" y="76">变更</text>
  </g>

  <!-- 行数据：y 从 84 开始，每行 21.5 -->
  <g font-size="10.5" fill="#1F2937">
    <!-- 序 -->
    <rect x="20" y="84" width="640" height="21" fill="#F0FDF4"/>
    <text x="30" y="99" font-weight="600">序</text>
    <text x="76" y="99">12×8</text>
    <text x="140" y="99">96</text>
    <text x="230" y="99">雪夜云溪镇</text>
    <text x="440" y="99">ObjectType1 城镇</text>
    <text x="596" y="99" fill="#9CA3AF">—</text>

    <rect x="20" y="105" width="640" height="21" fill="#FFFFFF"/>
    <text x="30" y="120" font-weight="600">1</text>
    <text x="76" y="120">16×12</text>
    <text x="140" y="120">192</text>
    <text x="230" y="120">青要山道（纵向推进）</text>
    <text x="440" y="120">ObjectType9 山野</text>
    <text x="596" y="120" fill="#9CA3AF">—</text>

    <rect x="20" y="126" width="640" height="21" fill="#F0FDF4"/>
