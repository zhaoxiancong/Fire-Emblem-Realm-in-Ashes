<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>16 个法术特效 ID 的分配规划</title>
  <desc>《山河烬》custom-spell-effect 私有区段 0x80~0x8F 的分配：法系神器 3、原创法系招牌法术 6、BOSS 专属 3、预留 4。9 件神器只占 3 个。</desc>
  <rect width="680" height="470" fill="#ffffff"/>

  <text x="24" y="32" font-size="17" font-weight="700" fill="#1f2328">法术特效 ID 空间（0x80 ~ 0x8F，共 16 个）</text>
  <text x="24" y="54" font-size="12" fill="#57606a">框架私有密集区段 · CUSTOM_SPELL_EFFECT_BASE = 0x80 · 9 件神器只占其中 3 个</text>

  <!-- 分组标题 -->
  <text x="24" y="88" font-size="12" font-weight="700" fill="#8250df">法系神器（3）</text>
  <text x="180" y="88" font-size="12" font-weight="700" fill="#0969da">原创法系招牌法术（6）</text>
  <text x="412" y="88" font-size="12" font-weight="700" fill="#bf8700">BOSS 专属（3）</text>
  <text x="548" y="88" font-size="12" font-weight="700" fill="#57606a">预留（4）</text>

  <!-- 0x80 - 0x82 法系神器 -->
  <g>
    <rect x="24" y="98" width="38" height="54" rx="5" fill="#8250df"/>
    <text x="29" y="120" font-size="10" fill="#e9d8fd">80</text>
    <text x="29" y="138" font-size="10" fill="#ffffff" font-weight="700">流照</text>

    <rect x="66" y="98" width="38" height="54" rx="5" fill="#8250df"/>
    <text x="71" y="120" font-size="10" fill="#e9d8fd">81</text>
    <text x="71" y="138" font-size="10" fill="#ffffff" font-weight="700">惊雷</text>

    <rect x="108" y="98" width="38" height="54" rx="5" fill="#8250df"/>
    <text x="113" y="120" font-size="10" fill="#e9d8fd">82</text>
    <text x="113" y="138" font-size="10" fill="#ffffff" font-weight="700">山鬼</text>
  </g>

  <!-- 0x83 - 0x88 原创法系招牌 -->
  <g>
    <rect x="180" y="98" width="34" height="54" rx="5" fill="#0969da"/>
    <text x="185" y="120" font-size="10" fill="#cae8ff">83</text>
    <text x="183" y="138" font-size="9.5" fill="#ffffff" font-weight="700">天·1</text>

    <rect x="218" y="98" width="34" height="54" rx="5" fill="#0969da"/>
    <text x="223" y="120" font-size="10" fill="#cae8ff">84</text>
    <text x="221" y="138" font-size="9.5" fill="#ffffff" font-weight="700">天·2</text>

    <rect x="256" y="98" width="34" height="54" rx="5" fill="#0969da"/>
    <text x="261" y="120" font-size="10" fill="#cae8ff">85</text>
    <text x="259" y="138" font-size="9.5" fill="#ffffff" font-weight="700">地·1</text>

    <rect x="294" y="98" width="34" height="54" rx="5" fill="#0969da"/>
    <text x="299" y="120" font-size="10" fill="#cae8ff">86</text>
    <text x="297" y="138" font-size="9.5" fill="#ffffff" font-weight="700">地·2</text>

    <rect x="332" y="98" width="34" height="54" rx="5" fill="#0969da"/>
    <text x="337" y="120" font-size="10" fill="#cae8ff">87</text>
    <text x="335" y="138" font-size="9.5" fill="#ffffff" font-weight="700">人·1</text>

    <rect x="370" y="98" width="34" height="54" rx="5" fill="#0969da"/>
    <text x="375" y="120" font-size="10" fill="#cae8ff">88</text>
    <text x="373" y="138" font-size="9.5" fill="#ffffff" font-weight="700">人·2</text>
  </g>

  <!-- 0x89 - 0x8B BOSS -->
  <g>
    <rect x="412" y="98" width="38" height="54" rx="5" fill="#bf8700"/>
    <text x="417" y="120" font-size="10" fill="#fff8c5">89</text>
    <text x="415" y="138" font-size="10" fill="#ffffff" font-weight="700">四凶</text>

    <rect x="454" y="98" width="38" height="54" rx="5" fill="#bf8700"/>
    <text x="459" y="120" font-size="10" fill="#fff8c5">8A</text>
    <text x="457" y="138" font-size="10" fill="#ffffff" font-weight="700">三狱</text>

    <rect x="496" y="98" width="38" height="54" rx="5" fill="#bf8700"/>
    <text x="501" y="120" font-size="10" fill="#fff8c5">8B</text>
    <text x="499" y="138" font-size="10" fill="#ffffff" font-weight="700">国师</text>
  </g>

  <!-- 0x8C - 0x8F 预留 -->
  <g>
    <rect x="548" y="98" width="26" height="54" rx="5" fill="#eaeef2" stroke="#d0d7de"/>
    <text x="553" y="120" font-size="10" fill="#8c959f">8C</text>
    <rect x="578" y="98" width="26" height="54" rx="5" fill="#eaeef2" stroke="#d0d7de"/>
    <text x="583" y="120" font-size="10" fill="#8c959f">8D</text>
    <rect x="608" y="98" width="26" height="54" rx="5" fill="#eaeef2" stroke="#d0d7de"/>
    <text x="613" y="120" font-size="10" fill="#8c959f">8E</text>
    <rect x="638" y="98" width="18" height="54" rx="5" fill="#eaeef2" stroke="#d0d7de"/>
    <text x="641" y="120" font-size="10" fill="#8c959f">8F</text>
  </g>

  <line x1="24" y1="176" x2="656" y2="176" stroke="#d0d7de"/>

  <text x="24" y="206" font-size="14" font-weight="700" fill="#1f2328">9 件神器逐件定案 —— 只需 3 个 ID</text>

  <!-- 路径 A -->
  <rect x="24" y="222" width="300" height="88" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="38" y="245" font-size="12.5" font-weight="700" fill="#1a7f37">路径 A · banim 调色板换色（ID 消耗 0）</text>
  <text x="38" y="268" font-size="11.5" fill="#24292f">照夜/明烛（剑）· 破军（枪）· 白虹（刀）· 镇岳（锤）</text>
  <text x="38" y="288" font-size="11" fill="#57606a">复用原版职业战斗动画 + 专属 .pal 调色板</text>
  <text x="38" y="304" font-size="11" fill="#57606a">这也是原版 Siegline / Siegmund 的做法（_efx = -1）</text>

  <!-- 路径 C -->
  <rect x="336" y="222" width="160" height="88" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="350" y="245" font-size="12.5" font-weight="700" fill="#0969da">路径 C · 复用原版（0）</text>
  <text x="350" y="268" font-size="11.5" fill="#24292f">落雁（弓）</text>
  <text x="350" y="288" font-size="11" fill="#57606a">复用原版箭矢</text>
  <text x="350" y="304" font-size="11" fill="#57606a">_efx = 2</text>

  <!-- 路径 B -->
  <rect x="508" y="222" width="148" height="88" rx="8" fill="#fbefff" stroke="#8250df"/>
  <text x="522" y="245" font-size="12.5" font-weight="700" fill="#8250df">路径 B · 新建特效（3）</text>
  <text x="522" y="268" font-size="11.5" fill="#24292f">流照（琴）</text>
  <text x="522" y="285" font-size="11.5" fill="#24292f">惊雷引（符箓）</text>
  <text x="522" y="302" font-size="11.5" fill="#24292f">山鬼谣（咒具）</text>

  <line x1="24" y1="330" x2="656" y2="330" stroke="#d0d7de"/>
  <text x="24" y="356" font-size="13" font-weight="700" fill="#1a7f37">结论：9 件神器 = 5 物理（0 个）+ 1 弓（0 个）+ 3 法系（3 个）= 共 3 个 ID</text>

  <text x="24" y="386" font-size="11.5" fill="#57606a">决定性依据：原版 9 件神圣武器中，Siegline（剑）/ Siegmund（枪）的 _efx 均为 -1 —— 物理神器完全不占法术特效；</text>
  <text x="24" y="404" font-size="11.5" fill="#57606a">只有法系神器（Excalibur 0x35 / Ivaldi 0x3F / Gleipnir 0x41）才挂 _efx。原版自己就解决了这个矛盾。</text>

  <text x="24" y="434" font-size="11.5" fill="#8250df">Demo 期可为 0 个：惊雷引在「外传 1」，序章~第 4 章不出现。</text>
  <text x="24" y="454" font-size="11" fill="#8c959f">配色零成本：MCOLOR 仅 6 种（NORMAL/DARK/FIRE/ICE/WIND/LIGHT）→ 白焰=LIGHT · 雷=NORMAL · 青辉=WIND · 幽冥=DARK</text>
</svg>
