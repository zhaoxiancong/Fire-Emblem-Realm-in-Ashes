<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>《山河烬》22 章 → 原版 10 套地图瓦片集 复用分布</title>
  <desc>每行一套原版瓦片集，每个色块是一章。全部 22 章均落在原版已有的 10 套瓦片集内，必须新增的元瓦片数量为 0。</desc>

  <rect width="680" height="430" fill="#ffffff"/>

  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2328">22 章 → 原版 10 套瓦片集：复用分布</text>
  <text x="20" y="48" font-size="11.5" fill="#57606a">结论：全部章节均落在原版已含的 10 套之内 ⇒「必须新增的元瓦片」= 0（残余成本只剩调色板派生与地图变更）</text>

  <!-- 列头：章节序号 -->
  <g font-size="9.5" fill="#57606a" text-anchor="middle">
    <text x="205" y="72">序</text>
    <text x="223" y="72">1</text><text x="241" y="72">2</text><text x="259" y="72">3</text><text x="277" y="72">4</text>
    <text x="295" y="72">5</text><text x="313" y="72">6</text><text x="331" y="72">7</text><text x="349" y="72">8</text>
    <text x="367" y="72">9</text><text x="385" y="72">10</text><text x="403" y="72">11</text><text x="421" y="72">12</text>
    <text x="439" y="72">13</text><text x="457" y="72">14</text><text x="475" y="72">15</text><text x="493" y="72">16</text>
    <text x="511" y="72">17</text><text x="529" y="72">18</text><text x="547" y="72">19</text><text x="565" y="72">20</text>
    <text x="583" y="72">外2</text>
  </g>

  <!-- 行：tileset 名 + 主题 + 色块 -->
  <!-- y 起始 82，行高 30 -->
  <g font-size="11">
    <!-- ObjectType1 城镇 (5章) -->
    <text x="20" y="101" fill="#1f2328" font-weight="600">ObjectType1</text>
    <text x="96" y="101" fill="#57606a" font-size="10">城镇</text>
    <text x="640" y="101" fill="#8a5a00" font-size="10" text-anchor="end">5 章</text>
    <g fill="#c98a3a">
      <rect x="196" y="88" width="18" height="18" rx="3"/>
      <rect x="250" y="88" width="18" height="18" rx="3"/>
      <rect x="268" y="88" width="18" height="18" rx="3"/>
      <rect x="286" y="88" width="18" height="18" rx="3"/>
      <rect x="520" y="88" width="18" height="18" rx="3"/>
    </g>

    <!-- ObjectType2 城塞 (3) -->
    <text x="20" y="131" fill="#1f2328" font-weight="600">ObjectType2</text>
    <text x="96" y="131" fill="#57606a" font-size="10">城塞</text>
    <text x="640" y="131" fill="#57606a" font-size="10" text-anchor="end">3 章</text>
    <g fill="#7b8794">
      <rect x="304" y="118" width="18" height="18" rx="3"/>
      <rect x="376" y="118" width="18" height="18" rx="3"/>
      <rect x="538" y="118" width="18" height="18" rx="3"/>
    </g>

    <!-- ObjectType3 郊野/山道 (2) -->
    <text x="20" y="161" fill="#1f2328" font-weight="600">ObjectType3</text>
    <text x="96" y="161" fill="#57606a" font-size="10">郊野 / 山道</text>
    <text x="640" y="161" fill="#57606a" font-size="10" text-anchor="end">2 章</text>
    <g fill="#6aa84f">
      <rect x="214" y="148" width="18" height="18" rx="3"/>
      <rect x="322" y="148" width="18" height="18" rx="3"/>
    </g>

    <!-- ObjectType4 沙漠/边塞 (1) -->
    <text x="20" y="191" fill="#1f2328" font-weight="600">ObjectType4</text>
    <text x="96" y="191" fill="#57606a" font-size="10">沙漠 / 边塞</text>
    <text x="640" y="191" fill="#57606a" font-size="10" text-anchor="end">1 章</text>
    <rect x="340" y="178" width="18" height="18" rx="3" fill="#d4b04a"/>

    <!-- ObjectType5 草原 (1) -->
    <text x="20" y="221" fill="#1f2328" font-weight="600">ObjectType5</text>
    <text x="96" y="221" fill="#57606a" font-size="10">草原</text>
    <text x="640" y="221" fill="#57606a" font-size="10" text-anchor="end">1 章</text>
    <rect x="358" y="208" width="18" height="18" rx="3" fill="#93b862"/>

    <!-- ObjectType6 岩地/荒原 (4) -->
    <text x="20" y="251" fill="#1f2328" font-weight="600">ObjectType6</text>
    <text x="96" y="251" fill="#57606a" font-size="10">岩地 / 荒原</text>
    <text x="640" y="251" fill="#8a5a00" font-size="10" text-anchor="end">4 章</text>
    <g fill="#a08b78">
      <rect x="394" y="238" width="18" height="18" rx="3"/>
      <rect x="502" y="238" width="18" height="18" rx="3"/>
      <rect x="556" y="238" width="18" height="18" rx="3"/>
      <rect x="574" y="238" width="18" height="18" rx="3"/>
    </g>

    <!-- ObjectType7 水面/河岸 (4) -->
    <text x="20" y="281" fill="#1f2328" font-weight="600">ObjectType7</text>
    <text x="96" y="281" fill="#57606a" font-size="10">水面 / 河岸</text>
    <text x="640" y="281" fill="#8a5a00" font-size="10" text-anchor="end">4 章</text>
    <g fill="#4a90c4">
      <rect x="232" y="268" width="18" height="18" rx="3"/>
      <rect x="412" y="268" width="18" height="18" rx="3"/>
      <rect x="430" y="268" width="18" height="18" rx="3"/>
      <rect x="466" y="268" width="18" height="18" rx="3"/>
    </g>

    <!-- ObjectType8 城郊/村落 (2) -->
    <text x="20" y="311" fill="#1f2328" font-weight="600">ObjectType8</text>
    <text x="96" y="311" fill="#57606a" font-size="10">城郊 / 村落</text>
    <text x="640" y="311" fill="#57606a" font-size="10" text-anchor="end">2 章</text>
    <g fill="#c47ab0">
      <rect x="448" y="298" width="18" height="18" rx="3"/>
      <rect x="484" y="298" width="18" height="18" rx="3"/>
    </g>

    <!-- ObjectType9 林地/山野 (2) -->
    <text x="20" y="341" fill="#1f2328" font-weight="600">ObjectType9</text>
    <text x="96" y="341" fill="#57606a" font-size="10">林地 / 山野</text>
    <text x="640" y="341" fill="#57606a" font-size="10" text-anchor="end">2 章</text>
    <g fill="#3f8f6f">
      <rect x="454" y="328" width="18" height="18" rx="3"/>
      <rect x="472" y="328" width="18" height="18" rx="3"/>
    </g>

    <!-- ObjectType10 外传 (1) -->
    <text x="20" y="371" fill="#1f2328" font-weight="600">ObjectType10</text>
    <text x="96" y="371" fill="#57606a" font-size="10">（外传专用）</text>
    <text x="640" y="371" fill="#57606a" font-size="10" text-anchor="end">1 章</text>
    <rect x="580" y="358" width="18" height="18" rx="3" fill="#8a6bd1"/>
  </g>

  <!-- 汇总条 -->
  <rect x="20" y="390" width="640" height="26" rx="5" fill="#eef7ee" stroke="#b7d9b7"/>
  <text x="32" y="407" font-size="11.5" fill="#1a6b2a">
    合计 22 章 → 命中 10/10 套原版瓦片集　·　必须新增元瓦片 <tspan font-weight="700">0 个</tspan>　·　残余成本 = 调色板派生（昼夜/天气）+ 地图变更（第 6/10/16/20 章，需手写事件）
  </text>
</svg>
